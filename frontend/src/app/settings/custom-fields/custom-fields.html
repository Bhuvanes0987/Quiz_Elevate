<div class="page-container">

  <!-- HEADER ROW -->
  <div class="header-row">
    <h2>Questions</h2>
    <button class="add-btn" (click)="openAddPanel()">Add Question</button>
  </div>

  <!-- SEARCH BAR -->
  <div class="search-container">
    <input
      type="text"
      [(ngModel)]="searchText"
      placeholder="Search questions..."
    />
  </div>

  <!-- TABLE -->
  <table class="question-table">
    <thead>
      <tr>
        <th>Question</th>
        <th>Type</th>
        <th>Class</th>
        <th>Subject</th>
        <th>Unit</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let q of filteredQuestions">
        <td class="qtext">{{ q.question_text }}</td>
        <td>{{ q.question_type }}</td>
        <td>{{ q.class }}</td>
        <td>{{ q.subject }}</td>
        <td>{{ q.unit }}</td>

        <td class="actions">
          <button class="edit" (click)="openEditPanel(q)">Edit</button>
          <button class="delete" (click)="deleteQuestion(q.id)">Delete</button>
        </td>
      </tr>
      <tr *ngIf="filteredQuestions.length === 0">
        <td colspan="6" class="no-data">No questions found.</td>
      </tr>
    </tbody>
  </table>

  <!-- RIGHT SIDE PANEL -->
  <div class="side-panel" [class.open]="showAddPanel" role="dialog" aria-hidden="{{!showAddPanel}}">
    <div class="panel-header">
      <h3>{{ editingQuestion ? 'Edit Question' : 'Add Question' }}</h3>
      <button class="close-btn" (click)="closePanel()">✕</button>
    </div>

    <div class="panel-body">
      <!-- Question basic -->
      <label>Class</label>
      <input [(ngModel)]="form.class" placeholder="10 / 11" />

      <label>Subject</label>
      <input [(ngModel)]="form.subject" placeholder="Maths" />

      <label>Unit</label>
      <input [(ngModel)]="form.unit" placeholder="Unit 1" />

      <label>Question Text</label>
      <textarea [(ngModel)]="form.questionText"></textarea>

      <label>Question Type</label>
      <select [(ngModel)]="form.questionType">
        <option value="choose">Choose (MCQ)</option>
        <option value="match">Match</option>
        <option value="fillup">Fill Up</option>
        <option value="map">Map</option>
      </select>

      <!-- CHOOSE -->
      <div *ngIf="form.questionType === 'choose'">
        <div *ngFor="let opt of form.options; let i = index" class="option-row">
          <input [(ngModel)]="form.options[i]" placeholder="Option {{i + 1}}" />
          <label class="radio">
            <input type="radio" name="correct" [(ngModel)]="form.correctAnswer" [value]="i" /> Correct
          </label>
          <button class="mini" (click)="removeOption(i)" type="button">-</button>
        </div>
        <button class="mini" (click)="addOption()" type="button">+ Add Option</button>
      </div>

      <!-- MATCH -->
      <div *ngIf="form.questionType === 'match'">
        <div *ngFor="let p of form.matchPairs; let i = index" class="match-row">
          <input [(ngModel)]="form.matchPairs[i].left" placeholder="Left" />
          <input [(ngModel)]="form.matchPairs[i].right" placeholder="Right" />
          <button class="mini" (click)="removeMatchPair(i)" type="button">-</button>
        </div>
        <button class="mini" (click)="addMatchPair()" type="button">+ Add Pair</button>
      </div>

      <!-- FILLUP -->
      <div *ngIf="form.questionType === 'fillup'">
        <label>Correct Answer (hidden from students)</label>
        <input [(ngModel)]="form.correctAnswerText" />
      </div>

      <!-- MAP -->
      <div *ngIf="form.questionType === 'map'">
        <label>Upload Map Image</label>
        <input type="file" (change)="onMapUpload($event)" />
        <div *ngIf="form.mapImageBase64" class="preview">
          <img [src]="form.mapImageBase64" alt="map preview" />
        </div>
      </div>

      <div class="panel-actions">
        <button class="save" (click)="saveQuestion()">Save</button>
        <button class="cancel" (click)="closePanel()">Cancel</button>
      </div>
    </div>
  </div>

</div>
