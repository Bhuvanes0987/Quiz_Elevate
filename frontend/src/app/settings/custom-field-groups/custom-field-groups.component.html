<div class="page-container">

  <!-- ================= LIST PAGE ================= -->
  <ng-container *ngIf="pageMode === 'LIST'">

    <div class="page-header">
      <h2>Custom Field Groups</h2>
      <button class="btn-add" (click)="openAddPage()">+ Create Group</button>
    </div>

    <input
      class="search-box"
      placeholder="Search groups..."
      [(ngModel)]="searchText"
    />

    <div class="table-card">
      <table class="theme-table">
        <thead>
          <tr>
            <th>Custom Field Group</th>
            <th>Class</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let group of filteredGroups">
            <td>{{ group.questionText }}</td>
            <td>{{ group.classNames || '-' }}</td>
            <td>
              <button class="btn-edit" (click)="openEditPage(group)">Edit</button>
              <button class="btn-delete" (click)="deleteGroup(group.id)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </ng-container>


  <!-- ================= EDIT PAGE ================= -->
  <ng-container *ngIf="pageMode === 'EDIT'">

    <button class="back-btn" (click)="goBack()">← Back</button>

    <h2>{{ form.id === 0 ? 'Create Group' : 'Edit Group' }}</h2>

    <!-- Group Name -->
    <label>Group Name</label>
    <input class="input" [(ngModel)]="form.questionText"/>

    <!-- Classes Multi Select -->
    <!-- <label>Classes</label>
    <select multiple class="input" [(ngModel)]="form.classIds">
      <option *ngFor="let c of userClasses" [value]="c.id">
        {{ c.class_name }}
      </option>
    </select> -->


    <!-- Custom Fields Section -->
    <div class="section-title">
      Custom Fields
      <button class="add-btn" (click)="addField()">+ Add Field</button>
    </div>


    <!-- FIELD LIST -->
    <div class="field-row"
         *ngFor="let field of form.fields; let i = index">

      <!-- LEFT SIDE -->
      <div class="field-name">

        <!-- NORMAL VIEW -->
        <span *ngIf="editingIndex !== i">
          {{ field.name }}
        </span>

        <!-- EDIT MODE -->
        <input *ngIf="editingIndex === i"
               class="input-small"
               [(ngModel)]="tempFieldName"
               (keydown.enter)="saveField(i)"
               (keydown.escape)="cancelEdit()" />

      </div>

      <!-- RIGHT SIDE ACTIONS -->
      <div class="field-actions">
        <i class="fa-solid fa-plus action-icon add"
          (click)="addNewCustomField()">
        </i>
    
        <!-- Show Pencil if NOT editing -->
        <i *ngIf="editingIndex !== i"
           class="fa-solid fa-pencil action-icon edit"
           (click)="editField(i)">
        </i>

        <!-- Show Save + Cancel when editing -->
        <ng-container *ngIf="editingIndex === i">
          <i class="fa-solid fa-check action-icon save"
             (click)="saveField(i)">
          </i>

          <i class="fa-solid fa-xmark action-icon cancel"
             (click)="cancelEdit()">
          </i>
        </ng-container>

        <!-- Trash always visible -->
        <i class="fa-solid fa-trash action-icon delete"
           (click)="removeField(i)">
        </i>

      </div>

    </div>


    <!-- ACTION BUTTONS -->
    <div class="actions">
      <button class="save-btn" (click)="updateGroup()">
        {{ form.id === 0 ? 'Create' : 'Update' }}
      </button>
      <button class="cancel-btn" (click)="goBack()">Cancel</button>
    </div>

  </ng-container>

</div>
